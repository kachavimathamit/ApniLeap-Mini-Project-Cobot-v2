<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Institute Dashboard | ApniLeap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="../css/styles.css" rel="stylesheet">
</head>
<body>

<nav class="al-navbar navbar navbar-expand-xl">
  <a class="al-brand" href="dashboard.html">APNI<span>LEAP</span></a>
  <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain" aria-controls="navMain" aria-expanded="false" aria-label="Toggle navigation">
    <span class="navbar-toggler-icon"></span>
  </button>
  <div class="collapse navbar-collapse" id="navMain">
    <div class="d-flex flex-column flex-xl-row">
      <a class="nav-link" href="dashboard.html">Dashboard</a>
      <a class="nav-link active" href="institutes.html">Institutes</a>
      <a class="nav-link" href="reports.html">Reports</a>
      <a class="nav-link d-none" id="navAdmin" href="administration.html">Administration</a>
    </div>
    <div class="d-flex align-items-center gap-2 ms-xl-auto mt-2 mt-xl-0">
      <span class="al-user-chip" id="userChip">&nbsp;</span>
      <button class="btn btn-sm btn-outline-light" id="logoutBtn">Logout</button>
    </div>
  </div>
</nav>

<div class="al-page">
  <div class="al-page-header">
    <div>
      <p class="al-page-subtitle mb-0"><a href="institutes.html">Institutes</a> / <span id="instituteName">…</span></p>
      <h1 class="al-page-title" id="instituteTitle">Institute Dashboard</h1>
    </div>
  </div>

  <div class="row g-2 mb-3">
    <div class="col-6 col-md-3 col-lg-2">
      <div class="al-stat-card">
        <div class="al-stat-label">Departments</div>
        <div class="al-stat-value" id="statDepartments">&ndash;</div>
      </div>
    </div>
    <div class="col-6 col-md-3 col-lg-2">
      <div class="al-stat-card">
        <div class="al-stat-label">Total Projects</div>
        <div class="al-stat-value" id="statTotal">&ndash;</div>
      </div>
    </div>
    <div class="col-6 col-md-3 col-lg-2">
      <div class="al-stat-card is-green">
        <div class="al-stat-label"><span class="al-rag-dot rag-green" role="img" aria-label="Green - On Track" title="Green - On Track"></span></div>
        <div class="al-stat-value" id="statGreen">&ndash;</div>
      </div>
    </div>
    <div class="col-6 col-md-3 col-lg-2">
      <div class="al-stat-card is-yellow">
        <div class="al-stat-label"><span class="al-rag-dot rag-yellow" role="img" aria-label="Yellow - At Risk" title="Yellow - At Risk"></span></div>
        <div class="al-stat-value" id="statYellow">&ndash;</div>
      </div>
    </div>
    <div class="col-6 col-md-3 col-lg-2">
      <div class="al-stat-card is-red">
        <div class="al-stat-label"><span class="al-rag-dot rag-red" role="img" aria-label="Red - Intervention Required" title="Red - Intervention Required"></span></div>
        <div class="al-stat-value" id="statRed">&ndash;</div>
      </div>
    </div>
  </div>

  <div class="al-card">
    <h2>Departments</h2>
    <div class="table-responsive">
      <table class="table al-table">
        <thead>
          <tr>
            <th>Department</th>
            <th>Head</th>
            <th class="text-end">Projects</th>
            <th class="text-end"><span class="al-rag-dot rag-green" role="img" aria-label="Green - On Track" title="Green - On Track"></span></th>
            <th class="text-end"><span class="al-rag-dot rag-yellow" role="img" aria-label="Yellow - At Risk" title="Yellow - At Risk"></span></th>
            <th class="text-end"><span class="al-rag-dot rag-red" role="img" aria-label="Red - Intervention Required" title="Red - Intervention Required"></span></th>
          </tr>
        </thead>
        <tbody id="departmentTableBody">
          <tr><td colspan="6" class="text-muted">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/api.js"></script>
<script src="../js/institute-dashboard.js"></script>
</body>
</html>
