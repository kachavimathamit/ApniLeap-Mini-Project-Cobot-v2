<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In | ApniLeap Mini-Project Portfolio Monitoring Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/styles.css" rel="stylesheet">
</head>
<body>
<div class="al-login-wrap">
  <div class="al-login-card">
    <div class="al-login-brand">ApniLeap</div>
    <div class="al-login-tagline">Mini-Project Portfolio Monitoring Portal</div>

    <form id="loginForm" novalidate>
      <div class="mb-3">
        <label for="email" class="form-label">SRN or email address</label>
        <input type="text" class="form-control" id="email" required autocomplete="username" autocapitalize="characters" spellcheck="false">
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input type="password" class="form-control" id="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-al-primary w-100" id="loginBtn">Sign In</button>
      <div class="al-login-error" id="loginError"></div>
    </form>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/login.js"></script>
</body>
</html>
